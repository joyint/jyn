[workspace]
resolver = "2"
members = [
    "crates/jyn-core",
    "crates/jyn-cli",
    "crates/jyn",
]

[workspace.dependencies]
# Cross-project dependency, handled like joy's own joy-crypt: the path wins
# for local builds inside the umbrella (always the sibling submodule's
# latest), and the widened "0" tracks whatever joy-core release is on
# crates.io for `cargo install jyn-cli` — no manual bump when joy-core
# releases on its own cycle (jyn's version-files only bump jyn's crates).
joy-core = { version = "0", path = "../joy/crates/joy-core" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
