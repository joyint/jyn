  text: |-
    [x] Added clap_complete (unstable-dynamic) as workspace + jyn-cli dep.
    [x] New commands/completions.rs: 'jyn completions <shell>' emits static scripts via clap_complete::generate for bash / zsh / fish / powershell / elvish; unknown shell bails with a listing of the supported set.
    [x] New complete.rs: dynamic completers (complete_task_id emits bare short forms plus #N@DATE occurrence addresses; complete_tag unions tag values on non-archived tasks). Both resolve the workspace root honoring JYN_WORKING_DIR, so completion works under -w too.
    [x] run() opens with clap_complete::CompleteEnv::with_factory(Cli::command).complete() so COMPLETE=<shell> jyn drives the dynamic protocol.
    [x] ArgValueCompleter attached on ShowArgs.id, EditArgs.id, AssignArgs.id, IdArgs.id (close/reopen/archive/unarchive), RmArgs.id, and AddArgs.tags / EditArgs.add_tags / EditArgs.remove_tags / LsArgs.tags.
    [x] Six new bats scenarios covering static outputs, unsupported-shell diagnostic, --help snippet, and dynamic ID/tag completion end-to-end. 102 bats + 60 unit tests, cargo fmt --check, clippy -D warnings all green.
    [x] Verified manually: static 'jyn completions bash' produces a _jyn function; dynamic 'COMPLETE=bash jyn -- jyn show ' returns bare IDs (1, 2, 3, 3@2026-04-13) and 'COMPLETE=bash jyn -- jyn ls --tag ' returns the tag union. No colon-aware bash wrapper needed - jyn has no ai:...@joy values.
