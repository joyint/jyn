description: 'Match the completions surface of joy: ''jyn completions <shell>'' emits static scripts for bash/zsh/fish/powershell/elvish, and the clap_complete_env dynamic protocol (''COMPLETE=zsh jyn'') completes task IDs, occurrence addresses (#N@DATE), and existing tags at the shell prompt. Setup snippet in --after_help. No colon-aware bash wrapper needed (jyn has no ai:...@joy values). Refines JOT-000D for jyn.'
